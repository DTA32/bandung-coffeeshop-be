when:
  - event: [push, manual]
    branch: [dev]

steps:
  - name: publish
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    when:
      - branch: dev
    settings:
      registry: ghcr.io
      repo: ghcr.io/dta32/bandung-coffeeshop-be/dev
      dockerfile: Dockerfile
      platforms: linux/amd64
      tags:
        - ${CI_COMMIT_SHA:0:7}
        - ${CI_PIPELINE_CREATED}-${CI_COMMIT_SHA:0:7}
      cache_images:
        - ghcr.io/dta32/bandung-coffeeshop-be/dev:cache
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token

  - name: discord success notification
    when:
      status: [ success ]
    image: appleboy/drone-discord
    settings:
      webhook_id:
        from_secret: discord_webhook_id
      webhook_token:
        from_secret: discord_webhook_token
      message: >
        {{repo.name}} build #{{build.commit}} | status: success.

  - name: discord failure notification
    when:
      status: [ failure ]
    image: appleboy/drone-discord
    settings:
      webhook_id:
        from_secret: discord_webhook_id
      webhook_token:
        from_secret: discord_webhook_token
      message: >
        {{repo.name}} build #{{build.commit}} | status: failed.